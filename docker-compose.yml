# docker-compose.yml — sans MongoDB : le bot ne dépend plus d'aucune base externe.
services:
  bot:
    build: .
    container_name: anos-voldigoad-mini-md
    restart: unless-stopped
    ports:
      - "${PORT:-20338}:20338"
    environment:
      - PORT=${PORT:-20338}
      - NODE_ENV=production
      - PREFIX=${PREFIX:-.}
      - API_KEY=${API_KEY:-anos-admin-secret-key-2026}
      - MAX_SESSIONS=${MAX_SESSIONS:-1000}
      - MAX_ACTIVE_CONNECTIONS=${MAX_ACTIVE_CONNECTIONS:-500}
      - MAX_RESTART_ATTEMPTS=${MAX_RESTART_ATTEMPTS:-8}
      - AUTO_DELETE_ON_LOGOUT=${AUTO_DELETE_ON_LOGOUT:-true}
      - RATE_LIMIT_PAIR=${RATE_LIMIT_PAIR:-3}
    volumes:
      - ./sessions:/app/sessions   # persistance : 1 session = 1 dossier sur disque
    # 500 sessions Baileys ouvertes en simultané consomment nettement plus
    # qu'une poignée : prévois large et ajuste selon l'usage réel observé
    # via /admin/health (memory.rss). Un socket WA "open" tourne grossièrement
    # entre 15 et 40 Mo selon l'activité -> ~4-8 Go pour 500 sessions actives.
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:20338/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
